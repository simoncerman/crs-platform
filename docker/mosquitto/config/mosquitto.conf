# Mosquitto MQTT Broker Configuration
# Czech Rocket Society - Development Environment

# General settings
listener 1883
protocol mqtt

# WebSocket listener (pro browser clients)
listener 9001
protocol websockets

# Authentication (pro development povolit anonymous)
allow_anonymous true

# Pro production nastavit:
# allow_anonymous false
# password_file /mosquitto/config/passwd

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true

# Connection limits
max_connections -1
max_queued_messages 1000

# Message limits
message_size_limit 0
